<h3 class="text-center">Fetch Data Using HTTPClient</h3>

@if(isLoading){
  <h1>Loading...</h1>
}
@else {
  <table class="table table-bordered">
    <tbody>
      @for (employee of employeeArr; track $index) {
        <tr>
          <td>{{ employee?.id }}</td>
          <td>{{ employee?.firstName }}</td>
          <td>{{ employee?.lastName }}</td>
          <td>{{ employee?.getFullName() }}</td>
          <td>{{ employee?.sal }}</td>
          <td>{{ employee?.getYearlySalary() }}</td>
          <td>{{ employee?.gender }}</td>
        </tr>
      }
    </tbody>
  </table>
}
